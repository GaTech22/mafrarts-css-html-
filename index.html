                    <!-- Definizione della forma dell'onda (diagonale morbida modificata per curvare verso l'esterno/basso) -->

                        <!-- La modifica inverte l'andamento della curva di Bezier, creando una pancia verso il basso -->

                    <!-- Primo livello: Onda superiore (colore arancione #F9A220) -->

                    <!-- Secondo livello: Onda inferiore (colore ereditato/primario, traslucida) -->
                    <!-- Traslata leggermente per creare profondità e sovrapposizione -->
